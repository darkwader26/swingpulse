version: "3.9"

services:
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: swingpulse_db
    environment:
      POSTGRES_USER: swingpulse
      POSTGRES_PASSWORD: swingpulse
      POSTGRES_DB: swingpulse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swingpulse -d swingpulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: swingpulse_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    container_name: swingpulse_api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://swingpulse:swingpulse@postgres:5432/swingpulse
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
      EXECUTION_MODE: paper
      LOG_LEVEL: info
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
  redis_data:
